<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gold Journal">

<link rel="manifest" href="manifest.json">

<title>Gold Journal</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080b10;
    color:#f5f7fa;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    padding-bottom:90px;
}

button,input,textarea{
    font:inherit;
}

.app{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.logo span{
    color:#f5c542;
}

.save-status{
    font-size:12px;
    color:#72e6a3;
}

/* MONTH SUMMARY */

.summary{
    background:linear-gradient(145deg,#111722,#0d1118);
    border:1px solid #202936;
    border-radius:20px;
    padding:18px;
    margin-bottom:15px;
}

.summary-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.month-title{
    font-size:20px;
    font-weight:800;
}

.month-pnl{
    font-size:28px;
    font-weight:900;
    margin-top:5px;
}

.positive{
    color:#42e88a;
}

.negative{
    color:#ff4d5e;
}

.neutral{
    color:#b9c0ca;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:16px;
}

.stat{
    background:#080c12;
    border-radius:13px;
    padding:11px;
    border:1px solid #1c2530;
}

.stat-label{
    color:#7e8998;
    font-size:11px;
}

.stat-value{
    font-size:15px;
    font-weight:800;
    margin-top:4px;
}

/* CALENDAR */

.calendar-box{
    background:#0d1219;
    border:1px solid #202936;
    border-radius:22px;
    padding:15px;
}

.calendar-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.nav-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:13px;
    background:#171e28;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.nav-btn:active{
    transform:scale(.94);
}

.calendar-month{
    font-size:19px;
    font-weight:900;
    text-transform:capitalize;
}

.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
    margin-bottom:6px;
}

.weekday{
    text-align:center;
    color:#687384;
    font-size:11px;
    font-weight:700;
    padding:5px 0;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
}

.day{
    min-height:76px;
    border-radius:12px;
    background:#111720;
    border:1px solid #1c2530;
    padding:7px;
    position:relative;
    overflow:hidden;
}

.day.empty{
    background:transparent;
    border-color:transparent;
}

.day-number{
    font-size:12px;
    color:#9ba5b2;
    font-weight:700;
}

.day-pnl{
    font-size:12px;
    font-weight:900;
    margin-top:17px;
    white-space:nowrap;
}

.day.trading-day{
    cursor:pointer;
}

.day.trading-day:hover{
    border-color:#566273;
}

.day.win{
    background:rgba(35,210,115,var(--intensity));
    border-color:rgba(65,240,140,.35);
}

.day.loss{
    background:rgba(240,55,75,var(--intensity));
    border-color:rgba(255,75,95,.35);
}

.day.win .day-pnl{
    color:#58ed9b;
}

.day.loss .day-pnl{
    color:#ff6875;
}

.today{
    box-shadow:inset 0 0 0 2px #f5c542;
}

/* ADD BUTTON */

.add-btn{
    position:fixed;
    right:20px;
    bottom:22px;
    width:62px;
    height:62px;
    border-radius:50%;
    border:none;
    background:#f5c542;
    color:#111;
    font-size:32px;
    font-weight:500;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    cursor:pointer;
    z-index:20;
}

.add-btn:active{
    transform:scale(.92);
}

/* MODAL */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:30;
}

.overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:600px;
    background:#10161e;
    border:1px solid #27313e;
    border-radius:25px 25px 0 0;
    padding:22px;
    padding-bottom:calc(22px + env(safe-area-inset-bottom));
    max-height:90vh;
    overflow-y:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-title{
    font-size:22px;
    font-weight:900;
}

.close{
    width:38px;
    height:38px;
    border:none;
    border-radius:12px;
    background:#1b232e;
    color:white;
    font-size:22px;
}

.form{
    display:grid;
    gap:13px;
}

label{
    font-size:12px;
    color:#8d98a7;
    display:block;
    margin-bottom:6px;
}

input,textarea{
    width:100%;
    border:1px solid #283340;
    background:#080d13;
    color:white;
    border-radius:12px;
    padding:13px;
    outline:none;
}

input:focus,textarea:focus{
    border-color:#f5c542;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.save-btn{
    margin-top:5px;
    width:100%;
    border:none;
    border-radius:14px;
    padding:15px;
    background:#f5c542;
    color:#111;
    font-weight:900;
    cursor:pointer;
}

/* TRADE LIST */

.trades-section{
    margin-top:15px;
    background:#0d1219;
    border:1px solid #202936;
    border-radius:20px;
    padding:15px;
}

.section-title{
    font-size:16px;
    font-weight:900;
    margin-bottom:12px;
}

.trade{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #1c2530;
}

.trade:last-child{
    border-bottom:none;
}

.trade-info{
    min-width:0;
}

.trade-date{
    font-size:11px;
    color:#727e8d;
}

.trade-main{
    margin-top:3px;
    font-size:13px;
    font-weight:800;
}

.trade-note{
    color:#737e8b;
    font-size:11px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:210px;
}

.trade-pnl{
    font-size:15px;
    font-weight:900;
}

.delete-btn{
    border:none;
    background:#1c232d;
    color:#ff6672;
    border-radius:9px;
    padding:7px 9px;
    margin-left:5px;
}

.empty-trades{
    color:#697585;
    text-align:center;
    padding:20px 0;
    font-size:13px;
}

/* BACKUP */

.backup{
    margin-top:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.backup button{
    border:1px solid #27313e;
    background:#111720;
    color:#dce1e7;
    padding:12px;
    border-radius:12px;
    font-weight:700;
}

/* DESKTOP */

@media(min-width:700px){
    .overlay{
        align-items:center;
    }

    .modal{
        border-radius:25px;
    }

    .day{
        min-height:105px;
    }

    .day-pnl{
        font-size:14px;
        margin-top:28px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🥇 Gold <span>Journal</span></div>
        <div class="save-status" id="saveStatus">● Запазено</div>
    </div>

    <div class="summary">

        <div class="summary-top">
            <div>
                <div class="month-title" id="summaryMonth"></div>
                <div class="month-pnl neutral" id="monthPnl">$0.00</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Печеливши дни</div>
                <div class="stat-value positive" id="winDays">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">Губещи дни</div>
                <div class="stat-value negative" id="lossDays">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">Сделки</div>
                <div class="stat-value" id="tradeCount">0</div>
            </div>
        </div>

    </div>

    <div class="calendar-box">

        <div class="calendar-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">‹</button>

            <div class="calendar-month" id="calendarMonth"></div>

            <button class="nav-btn" onclick="changeMonth(1)">›</button>
        </div>

        <div class="weekdays">
            <div class="weekday">П</div>
            <div class="weekday">В</div>
            <div class="weekday">С</div>
            <div class="weekday">Ч</div>
            <div class="weekday">П</div>
            <div class="weekday">С</div>
            <div class="weekday">Н</div>
        </div>

        <div class="calendar" id="calendar"></div>

    </div>

    <div class="trades-section">

        <div class="section-title">
            Последни сделки
        </div>

        <div id="tradeList"></div>

        <div class="backup">
            <button onclick="exportData()">⬇ Backup</button>
            <button onclick="document.getElementById('importFile').click()">⬆ Restore</button>
            <input id="importFile" type="file" accept=".json" style="display:none">
        </div>

    </div>

</div>

<button class="add-btn" onclick="openModal()">+</button>

<!-- MODAL -->

<div class="overlay" id="overlay">

    <div class="modal">

        <div class="modal-header">
            <div class="modal-title">Нова сделка</div>
            <button class="close" onclick="closeModal()">×</button>
        </div>

        <form class="form" id="tradeForm">

            <div>
                <label>Дата</label>
                <input type="date" id="tradeDate" required>
            </div>

            <div class="row">

                <div>
                    <label>Entry</label>
                    <input type="number" step="0.01" id="entry" placeholder="3650.20">
                </div>

                <div>
                    <label>Exit</label>
                    <input type="number" step="0.01" id="exit" placeholder="3660.20">
                </div>

            </div>

            <div class="row">

                <div>
                    <label>Lot</label>
                    <input type="number" step="0.01" id="lot" placeholder="0.02">
                </div>

                <div>
                    <label>P&L ($)</label>
                    <input type="number" step="0.01" id="pnl" placeholder="+25">
                </div>

            </div>

            <div>
                <label>Бележка</label>
                <textarea id="notes" placeholder="Напр. 4H trend + 15M entry..."></textarea>
            </div>

            <button class="save-btn" type="submit">
                ЗАПАЗИ СДЕЛКАТА
            </button>

        </form>

    </div>

</div>

<script>

/* =========================================================
   DATABASE
========================================================= */

const DB_NAME = "GoldJournalDB";
const DB_VERSION = 1;
const STORE = "trades";

let db;
let trades = [];

let currentMonth = new Date(
    new Date().getFullYear(),
    new Date().getMonth(),
    1
);


/* OPEN DATABASE */

function openDB(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded = function(e){

            const database = e.target.result;

            if(!database.objectStoreNames.contains(STORE)){

                const store =
                    database.createObjectStore(
                        STORE,
                        {keyPath:"id"}
                    );

                store.createIndex(
                    "date",
                    "date",
                    {unique:false}
                );
            }
        };

        request.onsuccess = function(e){

            db = e.target.result;
            resolve(db);

        };

        request.onerror = function(){

            reject(request.error);

        };

    });

}


/* GET ALL */

function getTrades(){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction(STORE,"readonly");

        const store =
            tx.objectStore(STORE);

        const request =
            store.getAll();

        request.onsuccess = () =>
            resolve(request.result || []);

        request.onerror = () =>
            reject(request.error);

    });

}


/* SAVE */

function saveTrade(trade){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction(STORE,"readwrite");

        tx.objectStore(STORE).put(trade);

        tx.oncomplete = () =>
            resolve();

        tx.onerror = () =>
            reject(tx.error);

    });

}


/* DELETE */

function deleteTrade(id){

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction(STORE,"readwrite");

        tx.objectStore(STORE).delete(id);

        tx.oncomplete = () =>
            resolve();

        tx.onerror = () =>
            reject(tx.error);

    });

}


/* =========================================================
   DATE HELPERS
========================================================= */

function localDate(){

    const d = new Date();

    const y = d.getFullYear();

    const m =
        String(d.getMonth()+1)
        .padStart(2,"0");

    const day =
        String(d.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${day}`;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    renderCalendar();
    renderSummary();
    renderTrades();

}


/* CALENDAR */

function renderCalendar(){

    const calendar =
        document.getElementById("calendar");

    calendar.innerHTML = "";

    const year =
        currentMonth.getFullYear();

    const month =
        currentMonth.getMonth();

    const firstDay =
        new Date(year,month,1);

    let start =
        firstDay.getDay();

    /*
       JS:
       Sunday = 0
       Convert to:
       Monday = 0
    */

    start =
        start === 0
        ? 6
        : start - 1;

    const days =
        new Date(year,month+1,0).getDate();

    const monthlyTrades =
        trades.filter(t=>{

            const d =
                new Date(t.date);

            return d.getFullYear() === year &&
                   d.getMonth() === month;

        });

    const daily = {};

    monthlyTrades.forEach(t=>{

        if(!daily[t.date]){
            daily[t.date] = 0;
        }

        daily[t.date] += Number(t.pnl) || 0;

    });

    const values =
        Object.values(daily)
        .map(Math.abs);

    const max =
        Math.max(...values,1);


    for(let i=0;i<start;i++){

        const empty =
            document.createElement("div");

        empty.className = "day empty";

        calendar.appendChild(empty);

    }


    for(let day=1;day<=days;day++){

        const key =
            `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

        const pnl =
            daily[key] || 0;

        const box =
            document.createElement("div");

        box.className = "day trading-day";

        if(pnl > 0){

            box.classList.add("win");

            const intensity =
                0.15 + (Math.abs(pnl)/max)*0.55;

            box.style.setProperty(
                "--intensity",
                Math.min(intensity,.75)
            );

        }

        if(pnl < 0){

            box.classList.add("loss");

            const intensity =
                0.15 + (Math.abs(pnl)/max)*0.55;

            box.style.setProperty(
                "--intensity",
                Math.min(intensity,.75)
            );

        }

        if(key === localDate()){
            box.classList.add("today");
        }

        const number =
            document.createElement("div");

        number.className = "day-number";
        number.textContent = day;

        box.appendChild(number);


        if(pnl !== 0){

            const pnlEl =
                document.createElement("div");

            pnlEl.className = "day-pnl";

            pnlEl.textContent =
                `${pnl > 0 ? "+" : ""}$${pnl.toFixed(2)}`;

            box.appendChild(pnlEl);

        }

        box.onclick = () => {

            openModal(key);

        };

        calendar.appendChild(box);

    }


    document.getElementById("calendarMonth")
        .textContent =
        new Intl.DateTimeFormat(
            "bg-BG",
            {
                month:"long",
                year:"numeric"
            }
        ).format(currentMonth);

}


/* SUMMARY */

function renderSummary(){

    const year =
        currentMonth.getFullYear();

    const month =
        currentMonth.getMonth();

    const monthly =
        trades.filter(t=>{

            const d =
                new Date(t.date);

            return d.getFullYear() === year &&
                   d.getMonth() === month;

        });

    const pnl =
        monthly.reduce(
            (sum,t)=>sum+(Number(t.pnl)||0),
            0
        );

    const days = {};

    monthly.forEach(t=>{

        days[t.date] =
            (days[t.date]||0)
            +(Number(t.pnl)||0);

    });

    const winDays =
        Object.values(days)
        .filter(v=>v>0).length;

    const lossDays =
        Object.values(days)
        .filter(v=>v<0).length;

    document.getElementById("summaryMonth")
        .textContent =
        new Intl.DateTimeFormat(
            "bg-BG",
            {
                month:"long",
                year:"numeric"
            }
        ).format(currentMonth);

    const pnlEl =
        document.getElementById("monthPnl");

    pnlEl.textContent =
        `${pnl >= 0 ? "+" : ""}$${pnl.toFixed(2)}`;

    pnlEl.className =
        "month-pnl " +
        (
            pnl > 0
            ? "positive"
            : pnl < 0
            ? "negative"
            : "neutral"
        );

    document.getElementById("winDays")
        .textContent = winDays;

    document.getElementById("lossDays")
        .textContent = lossDays;

    document.getElementById("tradeCount")
        .textContent = monthly.length;

}


/* TRADE LIST */

function renderTrades(){

    const list =
        document.getElementById("tradeList");

    list.innerHTML = "";

    const sorted =
        [...trades]
        .sort((a,b)=>
            new Date(b.created)-new Date(a.created)
        )
        .slice(0,10);

    if(!sorted.length){

        list.innerHTML =
            `<div class="empty-trades">
                Все още няма добавени сделки.
            </div>`;

        return;

    }


    sorted.forEach(t=>{

        const row =
            document.createElement("div");

        row.className = "trade";

        const pnl =
            Number(t.pnl)||0;

        row.innerHTML = `

            <div class="trade-info">

                <div class="trade-date">
                    ${formatDate(t.date)}
                </div>

                <div class="trade-main">
                    XAUUSD
                    ${t.lot ? " · "+t.lot+" lot" : ""}
                    ${t.entry ? " · "+t.entry : ""}
                    ${t.exit ? " → "+t.exit : ""}
                </div>

                ${
                    t.notes
                    ? `<div class="trade-note">${escapeHTML(t.notes)}</div>`
                    : ""
                }

            </div>

            <div>

                <span class="trade-pnl ${
                    pnl>=0 ? "positive" : "negative"
                }">

                    ${pnl>=0 ? "+" : ""}$${pnl.toFixed(2)}

                </span>

                <button
                    class="delete-btn"
                    onclick="removeTrade('${t.id}')">
                    ×
                </button>

            </div>
        `;

        list.appendChild(row);

    });

}


/* =========================================================
   MODAL
========================================================= */

function openModal(date){

    document.getElementById("tradeDate").value =
        date || localDate();

    document.getElementById("entry").value = "";
    document.getElementById("exit").value = "";
    document.getElementById("lot").value = "";
    document.getElementById("pnl").value = "";
    document.getElementById("notes").value = "";

    document.getElementById("overlay")
        .classList.add("show");

}


function closeModal(){

    document.getElementById("overlay")
        .classList.remove("show");

}


/* SAVE FORM */

document.getElementById("tradeForm")
.addEventListener("submit",async function(e){

    e.preventDefault();

    const trade = {

        id:
            Date.now().toString() +
            Math.random().toString(16).slice(2),

        date:
            document.getElementById("tradeDate").value,

        entry:
            document.getElementById("entry").value,

        exit:
            document.getElementById("exit").value,

        lot:
            document.getElementById("lot").value,

        pnl:
            Number(
                document.getElementById("pnl").value
            ) || 0,

        notes:
            document.getElementById("notes").value,

        created:
            new Date().toISOString()

    };


    try{

        showSaving();

        await saveTrade(trade);

        trades.push(trade);

        closeModal();

        render();

        showSaved();

    }catch(error){

        console.error(error);

        alert(
            "Не успях да запазя сделката. Опитай отново."
        );

    }

});


/* DELETE */

async function removeTrade(id){

    const ok =
        confirm("Да изтрия ли тази сделка?");

    if(!ok) return;

    await deleteTrade(id);

    trades =
        trades.filter(t=>t.id!==id);

    render();

}


/* MONTH */

function changeMonth(amount){

    currentMonth =
        new Date(
            currentMonth.getFullYear(),
            currentMonth.getMonth()+amount,
            1
        );

    render();

}


/* =========================================================
   BACKUP
========================================================= */

function exportData(){

    const blob =
        new Blob(
            [JSON.stringify(trades,null,2)],
            {type:"application/json"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        `gold-journal-backup-${localDate()}.json`;

    a.click();

    URL.revokeObjectURL(url);

}


document.getElementById("importFile")
.addEventListener("change",async function(e){

    const file = e.target.files[0];

    if(!file) return;

    try{

        const text =
            await file.text();

        const imported =
            JSON.parse(text);

        if(!Array.isArray(imported)){

            alert("Невалиден backup файл.");
            return;

        }

        for(const trade of imported){

            await saveTrade(trade);

        }

        trades =
            await getTrades();

        render();

        alert("Backup-ът е възстановен.");

    }catch(error){

        alert("Грешка при възстановяване.");

    }

});


/* =========================================================
   UTILITIES
========================================================= */

function formatDate(date){

    const d =
        new Date(date+"T00:00:00");

    return new Intl.DateTimeFormat(
        "bg-BG",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    ).format(d);

}


function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function showSaving(){

    document.getElementById("saveStatus")
        .textContent = "● Запазване...";

}


function showSaved(){

    document.getElementById("saveStatus")
        .textContent = "● Запазено";

}


/* =========================================================
   START APP
========================================================= */

async function startApp(){

    try{

        await openDB();

        trades =
            await getTrades();

        render();

        /*
          Request persistent storage where supported.
          This helps prevent the browser from automatically
          removing stored data.
        */

        if(
            navigator.storage &&
            navigator.storage.persist
        ){

            try{
                await navigator.storage.persist();
            }catch(e){}

        }

    }catch(error){

        console.error(error);

        alert(
            "Грешка при стартиране на базата данни."
        );

    }

}


/* SERVICE WORKER */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        ()=>{
            navigator.serviceWorker
                .register("./sw.js")
                .catch(err =>
                    console.log(
                        "Service Worker error:",
                        err
                    )
                );
        }
    );

}


startApp();

</script>
